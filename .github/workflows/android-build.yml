name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android project structure and fixes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/java/com/example/mytunnel
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/drawable app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/assets
          cp MainActivity.kt TunnelService.kt SpeedGraphView.kt app/src/main/java/com/example/mytunnel/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp activity_main.xml app/src/main/res/layout/activity_main.xml
          cp strings.xml themes.xml app/src/main/res/values/
          cp server_pill_bg.xml status_dot_connected.xml status_dot_connecting.xml status_dot_disconnected.xml app/src/main/res/drawable/
          cp af_logo.png app/src/main/res/drawable-nodpi/af_logo.png
          cp psiphon_config.json app/src/main/assets/psiphon_config.json

          # Android 14+ foreground-service declaration and app launcher icon
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' not in s:
              s = s.replace('<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />')
          s = s.replace('android:label="@string/app_name"', 'android:label="@string/app_name"\n        android:icon="@drawable/ic_app_icon"')
          if 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' not in s:
              s = s.replace('android:foregroundServiceType="specialUse" />', 'android:foregroundServiceType="specialUse">\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="VPN tunnel connection" />\n        </service>')
          manifest.write_text(s)

          service = Path('app/src/main/java/com/example/mytunnel/TunnelService.kt')
          s = service.read_text()
          if 'override fun onStartCommand' not in s:
              anchor = '    override fun onBind(intent: Intent?): IBinder = binder\n'
              addition = '''    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  // startForegroundService() must promote itself immediately, before the user taps Connect.
                  startForeground(NOTIFICATION_ID, buildNotification("Ready"))
                  return START_STICKY
              }

              '''
              if anchor not in s:
                  raise SystemExit('Could not find onBind insertion point in TunnelService.kt')
              s = s.replace(anchor, addition + anchor)
          service.write_text(s)
          PY

          # Simple built-in launcher icon (no external image needed)
          cat > app/src/main/res/drawable/ic_app_icon.xml <<'ICON'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#101820" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#66D8FF" android:pathData="M54,12 L88,25 L85,56 C82,75 68,89 54,96 C40,89 26,75 23,56 L20,25 Z" />
              <path android:fillColor="#0037A7" android:pathData="M54,23 L77,32 L75,55 C73,69 63,79 54,84 C45,79 35,69 33,55 L31,32 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,36 L36,70 L45,70 L50,60 L59,60 L64,70 L73,70 Z M54,48 L58,56 L50,56 Z" />
          </vector>
          ICON

          cat > settings.gradle <<'GRADLE_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/' }
              }
          }
          rootProject.name = 'MyTunnelApp'
          include ':app'
          GRADLE_SETTINGS
          cat > build.gradle <<'GRADLE_ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          GRADLE_ROOT
          cat > app/build.gradle <<'GRADLE_APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.mytunnel'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.mytunnel'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'ca.psiphon:psiphontunnel:2.0.39'
          }
          GRADLE_APP
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTunnelApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
