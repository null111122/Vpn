name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android project structure
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/java/com/example/mytunnel
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/drawable app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/assets
          cp MainActivity.kt TunnelService.kt SpeedGraphView.kt app/src/main/java/com/example/mytunnel/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp activity_main.xml app/src/main/res/layout/activity_main.xml
          cp strings.xml themes.xml app/src/main/res/values/
          cp server_pill_bg.xml status_dot_connected.xml status_dot_connecting.xml status_dot_disconnected.xml app/src/main/res/drawable/
          cp af_logo.png app/src/main/res/drawable-nodpi/af_logo.png
          cp psiphon_config.json app/src/main/assets/psiphon_config.json
          cat > settings.gradle <<'GRADLE_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/' }
              }
          }
          rootProject.name = 'MyTunnelApp'
          include ':app'
          GRADLE_SETTINGS
          cat > build.gradle <<'GRADLE_ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          GRADLE_ROOT
          cat > app/build.gradle <<'GRADLE_APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.mytunnel'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.mytunnel'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'ca.psiphon:psiphontunnel:2.0.39'
          }
          GRADLE_APP
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTunnelApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
