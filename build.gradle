plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.mytunnel'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mytunnel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Psiphon's official Maven repo (declared in settings.gradle) — check
    // https://github.com/Psiphon-Labs/psiphon-tunnel-core-Android-library
    // for the latest version before building for real.
    implementation 'ca.psiphon:psiphontunnel:2.0.39'
}
